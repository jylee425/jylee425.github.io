<!DOCTYPE HTML>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title id="page-title"></title>
    <script>
        var POST_TITLE = "Post Title";
        var POST_DATE = "2026-06-02";
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="../stylesheet.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌐</text></svg>">
    <style>
        .post-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .post-header {
            margin-bottom: 32px;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 16px;
        }

        .post-title {
            font-family: 'Lato', Verdana, Helvetica, sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 8px 0;
        }

        .post-meta {
            color: #999;
            font-size: 13px;
        }

        .post-content {
            line-height: 1.7;
        }

        .post-content p {
            margin-bottom: 16px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 24px;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="post-container">
        <a class="back-link" href="../index.html#posts">← Back</a>

        <div class="post-header">
            <p class="post-title" id="post-title"></p>
            <span class="post-meta" id="post-date"></span>
        </div>

        <div class="post-content">
            <p>Write your post content here.</p>
        </div>
    </div>
    <script>
        document.getElementById('page-title').textContent = POST_TITLE + ' — Juyong Lee';
        document.getElementById('post-title').textContent = POST_TITLE;
        document.getElementById('post-date').textContent = POST_DATE;
    </script>
</body>

</html>
